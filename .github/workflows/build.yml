name: Build ChallengeCore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat source.part00 source.part01 source.part02 source.part03 source.part04 source.partB source.partC | base64 -d > source.zip
          unzip -o source.zip

      - name: Apply ChallengeCore 1.0.1 patch
        run: python3 build_patch.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Forge mod
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChallengeCore-Forge-1.20.1-1.0.1
          path: build/libs/*.jar
          if-no-files-found: error
