name: Build ChallengeCore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat source.part00 source.part01 source.part02 source.part03 source.part04 source.partB source.partC | base64 -d > source.zip
          unzip -o source.zip

      - name: Apply 1.0.1 base patch
        run: python3 build_patch.py

      - name: Apply 1.0.2 ATM/casino patch
        run: python3 patch_v102a.py

      - name: Apply 1.0.2 boss/roulette patch
        run: python3 patch_v102b.py

      - name: Apply 1.0.3 overhaul
        run: python3 patch_v103.py

      - name: Prepare 1.0.3 generated assets
        run: python3 patch_v103_assets.py

      - name: Apply 1.0.4 sync and animation patch
        run: python3 patch_v104.py

      - name: Prepare 1.0.4 generated assets
        run: python3 patch_v104_assets.py

      - name: Apply 1.0.5 corrections
        run: python3 patch_v105.py

      - name: Prepare 1.0.5 generated assets
        run: python3 patch_v105_assets.py

      - name: Apply 1.0.8 corrections
        run: python3 patch_v108.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate 1.0.3 textures
        shell: bash
        run: |
          javac GenerateAssets103.java
          java -Djava.awt.headless=true GenerateAssets103

      - name: Generate 1.0.4 roulette/boss assets
        shell: bash
        run: |
          javac GenerateAssets104.java
          java -Djava.awt.headless=true GenerateAssets104

      - name: Generate 1.0.5 detailed assets
        shell: bash
        run: |
          javac GenerateAssets105.java
          java -Djava.awt.headless=true GenerateAssets105

      - name: Generate 1.0.8 assets
        shell: bash
        run: |
          javac GenerateAssets108.java
          java -Djava.awt.headless=true GenerateAssets108

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Forge mod
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChallengeCore-Forge-1.20.1-1.0.8
          path: build/libs/*.jar
          if-no-files-found: error
