name: Build ChallengeCore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat source.part00 source.part01 source.part02 source.part03 source.part04 source.partB source.partC | base64 -d > source.zip
          unzip -o source.zip

      - name: Apply Forge 1.20.1 source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/main/java/com/challengecore/client/ClientEvents.java")
          s = p.read_text()
          s = s.replace("import net.minecraftforge.client.event.RegisterMenuScreensEvent;\n",
                        "import net.minecraft.client.gui.screens.MenuScreens;\nimport net.minecraftforge.fml.event.lifecycle.FMLClientSetupEvent;\n")
          s = s.replace("@SubscribeEvent public static void registerScreens(RegisterMenuScreensEvent e){e.register(ModMenus.ATM.get(),AtmScreen::new);e.register(ModMenus.SLOT_CONFIG.get(),SlotConfigScreen::new);}",
                        "@SubscribeEvent public static void clientSetup(FMLClientSetupEvent e){e.enqueueWork(()->{MenuScreens.register(ModMenus.ATM.get(),AtmScreen::new);MenuScreens.register(ModMenus.SLOT_CONFIG.get(),SlotConfigScreen::new);});}")
          p.write_text(s)

          p = Path("src/main/java/com/challengecore/entity/ChallengeBossEntity.java")
          s = p.read_text().replace("Player target=getTarget();","var target=getTarget();").replace("Player t=getTarget();","var t=getTarget();")
          p.write_text(s)

          for f in ["GrillBlock.java","SlotMachineBlock.java","AtmBlock.java"]:
              p = Path("src/main/java/com/challengecore/block") / f
              s = p.read_text()
              if "import net.minecraft.world.level.block.Block;\n" not in s:
                  s = s.replace("import net.minecraft.world.level.block.BaseEntityBlock;\n",
                                "import net.minecraft.world.level.block.Block;\nimport net.minecraft.world.level.block.BaseEntityBlock;\n")
              p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Forge mod
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ChallengeCore-Forge-1.20.1
          path: build/libs/ChallengeCore-1.0.0.jar
          if-no-files-found: error
